[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metis"
version = "0.1.0.dev0"
description = "Prototype toolkit for task-specific model post-training"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.6", "transformers>=4.57,<5", "accelerate>=1.10,<2", "safetensors>=0.4", "PyYAML>=6"]
peft = ["peft>=0.17,<1"]
test = ["pytest>=8"]
docs = ["reportlab>=4", "pypdf>=5", "numpy>=1.26", "Pillow>=10"]

[project.scripts]
metis = "metis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
