[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metis"
version = "0.1.0.dev0"
description = "Task-specific model post-training, evaluation, and structured inference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
keywords = ["post-training", "ranking", "classification", "decision-models"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
train = ["torch>=2.6", "transformers>=4.57,<5", "accelerate>=1.10,<2", "safetensors>=0.4", "PyYAML>=6"]
peft = ["peft>=0.17,<1"]
test = ["pytest>=8"]
dev = ["pytest>=8", "build>=1.2,<2", "twine>=6,<7"]

[project.scripts]
metis = "metis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
