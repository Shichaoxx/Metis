name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CUDA_VISIBLE_DEVICES: ""
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  core:
    name: Core / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[test]"
      - run: python scripts/check_repository.py
      - name: Core contracts (model tests skip without optional dependencies)
        run: python -m pytest -q -rs
      - run: metis --help

  models:
    name: CPU models and LoRA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/checks.yml
      - name: Install the tested training stack with CPU Torch
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[train,peft,test]" transformers==4.57.6 accelerate==1.15.0 peft==0.21.0 pytest==8.4.2
      - name: Offline synthetic model tests
        run: python -m pytest -q -rs

  distribution:
    name: Wheel and source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ".[dev]"
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_distribution.py dist/*
      - name: Install and check the built wheel outside the checkout
        run: |
          python -m venv /tmp/metis-wheel-check
          /tmp/metis-wheel-check/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/metis-wheel-check/bin/python -c "import sys, metis; from metis.tasks import decide; assert 'torch' not in sys.modules; print(metis.__version__)"
          /tmp/metis-wheel-check/bin/metis --help
